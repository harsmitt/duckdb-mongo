#
# This workflow calls the main distribution pipeline from DuckDB to build, test and (optionally) release the extension
#
name: Main Extension Distribution Pipeline
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: true

jobs:
  duckdb-stable-build:
    name: Build extension binaries (DuckDB v1.5.5 stable)
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.5.5
    with:
      duckdb_version: v1.5.5
      ci_tools_version: v1.5.5
      extension_name: mongo
      exclude_archs: "wasm_mvp;wasm_eh;wasm_threads;windows_amd64_mingw;"
      # Newer than extension-ci-tools default (84bab45): that baseline still has
      # mongo-c-driver 1.30.6, which fails to configure on CMake 4.4 (macos-15),
      # and its msys2 package URLs 404. This commit ships mongo-c-driver 2.3.1#2
      # with upstream cmake-4.4.patch (CDRIVER-6367).
      vcpkg_commit: 'f74a2eade17a628413746557d04db25ccf6e76f9'

  duckdb-2-stable-build:
    name: Build extension binaries (DuckDB v2.0.0)
    # DuckDB 2.0-compatible CI tools branch, not a v2.0.0 tag.
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v2.0-cyanoptera
    with:
      duckdb_version: v2.0.0
      ci_tools_version: v2.0-cyanoptera
      extension_name: mongo
      exclude_archs: "wasm_mvp;wasm_eh;wasm_threads;windows_amd64_mingw;"
      # Smoke-test against the official DuckDB v2.0.0 CLI, not the staging CLI
      # bundled by extension-ci-tools (which may report an alpha version).
      post_build_command: >-
        curl -fsSL https://github.com/duckdb/duckdb/releases/download/v2.0.0/duckdb-cli-linux-amd64.tar.gz -o /tmp/duckdb-cli-v2.tar.gz &&
        mkdir -p /tmp/duckdb-cli-v2 &&
        tar -xzf /tmp/duckdb-cli-v2.tar.gz -C /tmp/duckdb-cli-v2 &&
        /tmp/duckdb-cli-v2/duckdb --version &&
        /tmp/duckdb-cli-v2/duckdb -unsigned -c "LOAD 'build/release/extension/mongo/mongo.duckdb_extension'; SELECT version(); SELECT function_name FROM duckdb_functions() WHERE function_name = 'mongo_scan';"
      vcpkg_commit: 'f74a2eade17a628413746557d04db25ccf6e76f9'

  duckdb-next-build:
    name: Build extension binaries (DuckDB main)
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@main
    with:
      duckdb_version: main
      ci_tools_version: main
      extension_name: mongo
      exclude_archs: "wasm_mvp;wasm_eh;wasm_threads;windows_amd64_mingw;"
      # Same pin as the existing stable build.
      vcpkg_commit: 'f74a2eade17a628413746557d04db25ccf6e76f9'

  code-quality-check:
    name: Code Quality Check
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_code_quality.yml@v2.0-cyanoptera
    with:
      duckdb_version: v2.0.0
      ci_tools_version: v2.0-cyanoptera
      extension_name: mongo
      # Tidy check disabled because it requires MongoDB C++ driver (vcpkg dependency).
      format_checks: 'format'

# CI trigger refresh after enabling GitHub Actions.
